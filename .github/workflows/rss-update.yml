name: Update RSS Feed

# 🔑 権限設定（方法1）
permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

on:
  # 手動実行
  workflow_dispatch:
  
  # スケジュール実行（中国時間 毎週金曜14:00 = UTC 6:00）
  schedule:
    - cron: '0 6 * * 5'

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0
        
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 依存ライブラリをインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Chromeブラウザをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
      - name: ChromeDriverをインストール
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1)
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version
          
      - name: RSSフィードを生成
        run: python rss_generator.py
        
      - name: 変更をコミットしてプッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feed.xml
          git diff --staged --quiet || git commit -m "RSSフィードを自動更新 [skip ci]"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
